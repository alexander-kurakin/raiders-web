<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Unity Web Player | RaidersTwo</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <!-- RaidersTwo (8.6_8.8): иконка и манифест для «На экран Домой»; viewport-fit=cover не ставим: Safari сам держит страницу вне выреза. -->
    <link rel="manifest" href="TemplateData/manifest.webmanifest">
    <link rel="apple-touch-icon" href="TemplateData/app-icon.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <link rel="stylesheet" href="TemplateData/style.css">
  </head>
  <body>
    <div id="unity-container" class="unity-desktop">
      <canvas id="unity-canvas" width=960 height=600 tabindex="-1"></canvas>
      <div id="unity-loading-bar">
        <div id="unity-logo"></div>
        <div id="unity-progress-bar-empty">
          <div id="unity-progress-bar-full"></div>
        </div>
      </div>
      <div id="unity-warning"> </div>
      <div id="raiders-rotate-plate">
        <div id="raiders-rotate-icon"></div>
        <div id="raiders-rotate-title"></div>
      </div>
      <div id="raiders-home-hint"><span id="raiders-home-text"></span><div id="raiders-home-close">&#10005;</div></div>
      <div id="unity-footer">
        <div id="unity-logo-title-footer"></div>
        <div id="unity-fullscreen-button"></div>
        <div id="unity-build-title">RaidersTwo</div>
      </div>
    </div>
    <script>
      // RaidersTwo (8.6_8.1): сенсорное устройство или ?touch=1 -> window.raidersTouchMode,
      // его читает игра через RaidersTouch.jslib. Определение стоит до createUnityInstance и до config.devicePixelRatio.
      // 8.6_8.13: на телефоне канвас в родном разрешении: DPR = min(devicePixelRatio, MOBILE_MAX_DEVICE_PIXEL_RATIO), ?dpr=<число> переопределяет.
      // Итог - window.raidersDpr (его читает игра: пиксели управления в CSS px и render scale 1/dpr). ?rs=<0.1..1> -> window.raidersRenderScale
      // (render scale 3D; без параметра не задан - игра берёт 1/dpr). На ПК без ?touch=1 ничего не меняется.
      const MOBILE_MAX_DEVICE_PIXEL_RATIO = 3;
      window.raidersTouchMode =
        /iPhone|iPad|iPod|Android/i.test(navigator.userAgent) ||
        (/Macintosh/i.test(navigator.userAgent) && navigator.maxTouchPoints > 1) ||
        new URLSearchParams(location.search).get("touch") === "1";
      if (window.raidersTouchMode) {
        var qs = new URLSearchParams(location.search);
        var dprParam = parseFloat(qs.get("dpr"));
        var rsParam = parseFloat(qs.get("rs"));
        window.raidersDpr = dprParam > 0 ? dprParam : Math.min(window.devicePixelRatio || 1, MOBILE_MAX_DEVICE_PIXEL_RATIO);
        if (rsParam > 0) window.raidersRenderScale = Math.min(Math.max(rsParam, 0.1), 1);
      }
      // RaidersTwo (8.6_8.10): звук на Android. Unity создаёт AudioContext до касания (он suspended) и будит его только на touchstart/mousedown,
      // а Chrome на Android даёт право на звук лишь touchend/pointerup/click/keydown. Запоминаем контексты и будим их на этих событиях (только сенсорный режим).
      // ?diag=1 (любой режим) - оверлей в левом верхнем углу: размеры, AudioContext, decodeAudioData, последние warn/error.
      (function () {
        var diag = new URLSearchParams(location.search).get("diag") === "1";
        if (!window.raidersTouchMode && !diag) return;
        var contexts = [];
        var wrapped = {};
        ["AudioContext", "webkitAudioContext"].forEach(function (name) {
          var Orig = window[name];
          if (!Orig) return;
          for (var k in wrapped) if (wrapped[k].orig === Orig) { window[name] = wrapped[k].proxy; return; }
          var proxy = new Proxy(Orig, {
            construct: function (target, args) {
              var ctx = Reflect.construct(target, args);
              contexts.push(ctx);
              return ctx;
            }
          });
          wrapped[name] = { orig: Orig, proxy: proxy };
          window[name] = proxy;
        });

        if (window.raidersTouchMode) {
          var resumeAll = function () {
            for (var i = 0; i < contexts.length; i++) {
              try {
                if (contexts[i].state === "suspended") {
                  var p = contexts[i].resume();
                  if (p && p.catch) p.catch(function () {});
                }
              } catch (e) {}
            }
          };
          ["touchend", "pointerup", "click", "keydown"].forEach(function (type) {
            window.addEventListener(type, resumeAll, { capture: true, passive: true });
          });
        }

        if (!diag) return;
        var decodeTotal = 0, decodeFailed = 0, lastLogs = [];
        var proto = window.BaseAudioContext && BaseAudioContext.prototype;
        if (proto && proto.decodeAudioData) {
          var origDecode = proto.decodeAudioData;
          proto.decodeAudioData = function (data, onOk, onFail) {
            decodeTotal++;
            if (typeof onOk === "function" || typeof onFail === "function") {
              return origDecode.call(this, data, onOk, function (e) {
                decodeFailed++;
                if (typeof onFail === "function") return onFail.apply(this, arguments);
              });
            }
            var promise = origDecode.apply(this, arguments);
            if (promise && promise.catch) promise.catch(function () { decodeFailed++; });
            return promise;
          };
        }
        ["warn", "error"].forEach(function (level) {
          var orig = console[level];
          console[level] = function () {
            try {
              var text = Array.prototype.map.call(arguments, function (a) { return typeof a === "string" ? a : (a && a.message) || String(a); }).join(" ");
              lastLogs.push(level + ": " + text.replace(/\s+/g, " ").slice(0, 110));
              if (lastLogs.length > 5) lastLogs.shift();
            } catch (e) {}
            return orig.apply(console, arguments);
          };
        });

        var box = document.createElement("div");
        box.id = "raiders-diag";
        box.style.cssText = "position:fixed;left:0;top:0;max-width:40vw;z-index:99999;pointer-events:none;box-sizing:border-box;padding:3px 5px;" +
          "font:10px/1.25 monospace;color:#cfc;background:rgba(0,0,0,0.6);white-space:pre-wrap;word-break:break-all;";
        (document.getElementById("unity-container") || document.body).appendChild(box);
        var cv = document.getElementById("unity-canvas");
        var update = function () {
          var cr = cv.getBoundingClientRect();
          var lines = [
            "win " + innerWidth + "x" + innerHeight + " dpr " + devicePixelRatio + " scr " + screen.width + "x" + screen.height,
            "dpr " + (window.raidersDpr || "-") + " rs " + (window.raidersRenderScale || "-"),
            "canvas buf " + cv.width + "x" + cv.height + " css " + Math.round(cr.width) + "x" + Math.round(cr.height),
            "fullscreen " + (document.fullscreenElement ? "yes" : "no") + " orient " + (screen.orientation ? screen.orientation.type : "?"),
            "audio ctx " + contexts.length + " decode " + decodeTotal + " fail " + decodeFailed
          ];
          contexts.forEach(function (c, i) {
            lines.push("  #" + i + " " + c.state + " " + c.sampleRate + "Hz t=" + c.currentTime.toFixed(2));
          });
          lastLogs.forEach(function (l) { lines.push(l); });
          box.textContent = lines.join("\n");
        };
        update();
        setInterval(update, 500);
      })();

      // RaidersTwo (8.6_8.8): полный экран, плашка «Поверни телефон» (CSS, только вертикально), подсказка «На экран Домой» на iPhone/iPad.
      (function () {
        if (!window.raidersTouchMode) return;
        var root = document.documentElement;
        var ru = /^ru/i.test(navigator.language || "");
        root.classList.add("raiders-touch");
        document.getElementById("raiders-rotate-title").textContent = ru ? "Поверни телефон" : "Rotate your phone";

        // iOS игнорирует user-scalable=no: щипок масштабирует страницу, если не гасить gesturestart.
        document.addEventListener("gesturestart", function (e) { e.preventDefault(); });

        // Android: по первому касанию - полный экран контейнера, затем блокировка горизонтали. Ошибки глотаем.
        // Жест «назад» выходит из полного экрана: по fullscreenchange (fullscreenElement == null) снова ждём первого касания.
        if (/Android/i.test(navigator.userAgent)) {
          var armed = false;
          var arm = function () {
            armed = false;
            document.addEventListener("pointerup", goFullscreen, true);
            document.addEventListener("touchend", goFullscreen, true);
          };
          var goFullscreen = function () {
            if (armed) return;
            armed = true;
            document.removeEventListener("pointerup", goFullscreen, true);
            document.removeEventListener("touchend", goFullscreen, true);
            try {
              var container = document.getElementById("unity-container");
              var request = container.requestFullscreen ? container.requestFullscreen() : null;
              Promise.resolve(request).then(function () {
                return screen.orientation && screen.orientation.lock ? screen.orientation.lock("landscape") : null;
              }).catch(function (e) { console.log("[RaidersTwo] fullscreen/orientation: " + e); });
            } catch (e) { console.log("[RaidersTwo] fullscreen/orientation: " + e); }
          };
          document.addEventListener("fullscreenchange", function () {
            if (document.fullscreenElement == null && armed) arm();
          });
          arm();
        }

        // iPhone/iPad Safari: не в iframe и не с иконки на домашнем экране. Лёжа - первые 8 с, вертикально - пока плашка поворота.
        var isIos = /iPhone|iPad|iPod/i.test(navigator.userAgent) || (/Macintosh/i.test(navigator.userAgent) && navigator.maxTouchPoints > 1);
        if (isIos && window.top === window.self && navigator.standalone !== true) {
          document.getElementById("raiders-home-text").textContent = ru
            ? "На весь экран: Поделиться → На экран Домой"
            : "Fullscreen: Share → Add to Home Screen";
          root.classList.add("raiders-ios-hint", "raiders-hint-landscape");
          setTimeout(function () { root.classList.remove("raiders-hint-landscape"); }, 8000);
          document.getElementById("raiders-home-close").addEventListener("click", function () {
            root.classList.remove("raiders-ios-hint", "raiders-hint-landscape");
          });
        }
      })();

      var canvas = document.querySelector("#unity-canvas");

      // Shows a temporary message banner/ribbon for a few seconds, or
      // a permanent error message on top of the canvas if type=='error'.
      // If type=='warning', a yellow highlight color is used.
      // Modify or remove this function to customize the visually presented
      // way that non-critical warnings and error messages are presented to the
      // user.
      function unityShowBanner(msg, type) {
        var warningBanner = document.querySelector("#unity-warning");
        function updateBannerVisibility() {
          warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
        }
        var div = document.createElement('div');
        div.innerHTML = msg;
        warningBanner.appendChild(div);
        if (type == 'error') div.style = 'background: red; padding: 10px;';
        else {
          if (type == 'warning') div.style = 'background: yellow; padding: 10px;';
          setTimeout(function() {
            warningBanner.removeChild(div);
            updateBannerVisibility();
          }, 5000);
        }
        updateBannerVisibility();
      }

      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/WebGL.new.loader.js";
      var config = {
        arguments: [],
        dataUrl: buildUrl + "/WebGL.new.data.unityweb",
        frameworkUrl: buildUrl + "/WebGL.new.framework.js.unityweb",
        codeUrl: buildUrl + "/WebGL.new.wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "DefaultCompany",
        productName: "RaidersTwo",
        productVersion: "0.1.0",
        showBanner: unityShowBanner,
        // errorHandler: function(err, url, line) {
        //    alert("error " + err + " occurred at line " + line);
        //    // Return 'true' if you handled this error and don't want Unity
        //    // to process it further, 'false' otherwise.
        //    return true;
        // },
      };

      // By default, Unity keeps WebGL canvas render target size matched with
      // the DOM size of the canvas element (scaled by window.devicePixelRatio)
      // Set this to false if you want to decouple this synchronization from
      // happening inside the engine, and you would instead like to size up
      // the canvas DOM size and WebGL render target sizes yourself.
      // config.matchWebGLToCanvasSize = false;

      // RaidersTwo: сохранение (PlayerData.json в Application.persistentDataPath) пишется через File.WriteAllText.
      // Без автосинхронизации файл живёт только в памяти вкладки и пропадает при перезагрузке:
      // Unity сбрасывает persistentDataPath в IndexedDB только по JS_FileSystem_Sync().
      // Единственная правка шаблона Default из Unity 6000.3.
      config.autoSyncPersistentDataPath = true;

      if (window.raidersTouchMode) {
        // Mobile device style: fill the whole browser client area with the game canvas:

        var meta = document.createElement('meta');
        meta.name = 'viewport';
        meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes';
        document.getElementsByTagName('head')[0].appendChild(meta);
        document.querySelector("#unity-container").className = "unity-mobile";
        canvas.className = "unity-mobile";

        // RaidersTwo (8.6_8.13): родной DPR на сенсорном устройстве (и при ?touch=1 на ПК).
        config.devicePixelRatio = window.raidersDpr;


      } else {
        // Desktop style: Render the game canvas in a window that can be maximized to fullscreen:
        canvas.style.width = "960px";
        canvas.style.height = "600px";
      }

      document.querySelector("#unity-loading-bar").style.display = "block";

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = () => {
        createUnityInstance(canvas, config, (progress) => {
          document.querySelector("#unity-progress-bar-full").style.width = 100 * progress + "%";
              }).then((unityInstance) => {
                document.querySelector("#unity-loading-bar").style.display = "none";
                document.querySelector("#unity-fullscreen-button").onclick = () => {
                  unityInstance.SetFullscreen(1);
                };

              }).catch((message) => {
                alert(message);
              });
            };

      document.body.appendChild(script);

    </script>
  </body>
</html>
